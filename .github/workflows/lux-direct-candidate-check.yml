name: LUX Direct isolated execution candidate tests

on:
  push:
    branches: [lux-direct-bot]
    paths:
      - 'lux_direct_bot/**'
      - '.github/workflows/lux-direct-candidate-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-network-candidate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: lux_direct_bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_live_execution_candidate.py tests/test_execution_runner.py
