name: LUX DIRECT BOT dry-run tests
on:
  push:
    branches: [lux-direct-bot]
    paths:
      - "lux_direct_bot/**"
      - ".github/workflows/lux-direct-bot-tests.yml"
  pull_request:
    branches: [lux-direct-bot]
    paths:
      - "lux_direct_bot/**"
      - ".github/workflows/lux-direct-bot-tests.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lux_direct_bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run isolated tests
        run: python -m pytest -q tests
      - name: Verify deployed service health and unauthenticated rejection
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request
          base = "https://lux-direct-bot-dryrun.onrender.com"
          with urllib.request.urlopen(base + "/health", timeout=50) as response:
              data = json.load(response)
          assert data["mode"] == "DRY_RUN", data
          assert data["live_trading"] is False, data
          assert set(data.get("allowed_symbols", [])) == {
              "XRPUSDT", "BNBUSDT", "AINUSDT", "MAGMAUSDT",
              "BIRBUSDT", "SANDUSDT",
          }, data
          assert data.get("allowed_timeframes") == ["5"], data
          request = urllib.request.Request(
              base + "/webhook/invalid",
              data=b'{"alert":"Bullish Confirmation Signal"}',
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              urllib.request.urlopen(request, timeout=50)
              raise AssertionError("Missing/invalid webhook secret unexpectedly accepted")
          except urllib.error.HTTPError as error:
              assert error.code == 403, error.code
          import time
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(base + "/terminal", timeout=35) as response:
                      terminal = response.read().decode("utf-8")
                      assert response.headers["Cache-Control"] == "no-store"
                  if ('id="switch"' in terminal
                      and "DRY RUN" in terminal
                      and "Real-money orders remain OFF" in terminal):
                      break
              except (urllib.error.HTTPError, urllib.error.URLError, AssertionError):
                  if attempt == 11:
                      raise
              time.sleep(5)
          else:
              raise AssertionError("Terminal not available after retries")
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(base + "/connect", timeout=35) as response:
                      connect = response.read().decode("utf-8")
                      assert response.headers["Cache-Control"] == "no-store"
                  if ('Copy private webhook URL' in connect
                      and "BINANCE:XRPUSDT.P" in connect
                      and "Render ADMIN_TOKEN" in connect):
                      break
              except (urllib.error.HTTPError, urllib.error.URLError, AssertionError):
                  if attempt == 11:
                      raise
              time.sleep(5)
          else:
              raise AssertionError("TradingView connection page unavailable")
          assert "/webhook/" not in connect, "Private webhook URL must never be in HTML"
          for restricted_path in ("/setup", "/connection/status"):
              req = urllib.request.Request(base + restricted_path)
              try:
                  urllib.request.urlopen(req, timeout=30)
                  raise AssertionError("Private connection endpoint publicly accessible")
              except urllib.error.HTTPError as error:
                  assert error.code == 403, error.code
          for method, url, data in [
              ("GET", "/operator/status", None),
              ("POST", "/operator/switch", b'{"enabled":true}'),
          ]:
              request = urllib.request.Request(
                  base + url, method=method, data=data,
                  headers={"Content-Type": "application/json"},
              )
              try:
                  urllib.request.urlopen(request, timeout=30)
                  raise AssertionError("Unauthenticated operator access accepted")
              except urllib.error.HTTPError as error:
                  assert error.code == 403, error.code
          print("Live dry-run switch UI and unauthorized operator route checks passed")
          PY
