name: LUX DIRECT BOT dry-run tests
on:
  push:
    branches: [lux-direct-bot]
    paths:
      - "lux_direct_bot/**"
      - ".github/workflows/lux-direct-bot-tests.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lux_direct_bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run isolated tests
        run: python -m pytest -q tests
