name: LUX DIRECT BOT dry-run tests
on:
  push:
    branches: [lux-direct-bot]
    paths:
      - "lux_direct_bot/**"
      - ".github/workflows/lux-direct-bot-tests.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lux_direct_bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run isolated tests
        run: python -m pytest -q tests
      - name: Verify deployed service health and unauthenticated rejection
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request
          base = "https://lux-direct-bot-dryrun.onrender.com"
          with urllib.request.urlopen(base + "/health", timeout=50) as response:
              data = json.load(response)
          assert data["mode"] == "DRY_RUN", data
          assert data["live_trading"] is False, data
          request = urllib.request.Request(
              base + "/webhook/invalid",
              data=b'{"alert":"Bullish Confirmation Signal"}',
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              urllib.request.urlopen(request, timeout=50)
              raise AssertionError("Missing/invalid webhook secret unexpectedly accepted")
          except urllib.error.HTTPError as error:
              assert error.code == 403, error.code
          import time
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(base + "/terminal", timeout=35) as response:
                      terminal = response.read().decode("utf-8")
                      assert response.headers["Cache-Control"] == "no-store"
                  if "Received LuxAlgo signals" in terminal and "No orders, positions or profit figures" in terminal:
                      break
              except (urllib.error.HTTPError, urllib.error.URLError, AssertionError):
                  if attempt == 11:
                      raise
              time.sleep(5)
          else:
              raise AssertionError("Terminal not available after retries")
          print("Deployed terminal, health and unauthorized webhook checks passed")
          PY
