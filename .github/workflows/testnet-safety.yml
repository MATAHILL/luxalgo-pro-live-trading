name: Testnet execution safety
on:
  push:
    branches: [main]
    paths:
      - 'gate_testnet_execution.py'
      - 'test_gate_testnet_execution.py'
      - 'testnet_protected_coordinator.py'
      - 'test_testnet_protected_coordinator.py'
      - 'gate_testnet_broker.py'
      - 'test_gate_testnet_broker.py'
      - 'testnet_execution_journal.py'
      - 'test_testnet_execution_journal.py'
      - 'testnet_automation.py'
      - 'test_testnet_automation.py'
      - 'testnet_recovery.py'
      - 'test_testnet_recovery.py'
      - 'app.py'
      - '.github/workflows/testnet-safety.yml'
  pull_request:
    paths:
      - 'gate_testnet_execution.py'
      - 'test_gate_testnet_execution.py'
      - 'testnet_protected_coordinator.py'
      - 'test_testnet_protected_coordinator.py'
      - 'gate_testnet_broker.py'
      - 'test_gate_testnet_broker.py'
      - 'testnet_execution_journal.py'
      - 'test_testnet_execution_journal.py'
      - 'testnet_automation.py'
      - 'test_testnet_automation.py'
      - 'testnet_recovery.py'
      - 'test_testnet_recovery.py'
      - 'app.py'
      - '.github/workflows/testnet-safety.yml'
permissions:
  contents: read
jobs:
  safety-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install database test dependency
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Compile files
        run: python -m py_compile gate_testnet_execution.py test_gate_testnet_execution.py testnet_protected_coordinator.py test_testnet_protected_coordinator.py gate_testnet_broker.py test_gate_testnet_broker.py testnet_execution_journal.py test_testnet_execution_journal.py testnet_automation.py test_testnet_automation.py testnet_recovery.py test_testnet_recovery.py app.py
      - name: Run isolated unit tests
        run: python -m unittest -v test_gate_testnet_execution.py test_testnet_protected_coordinator.py test_gate_testnet_broker.py test_testnet_execution_journal.py test_testnet_automation.py test_testnet_recovery.py
