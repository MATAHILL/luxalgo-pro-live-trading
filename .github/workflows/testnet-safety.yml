name: Testnet execution safety
on:
  push:
    branches: [main]
    paths:
      - 'gate_testnet_execution.py'
      - 'test_gate_testnet_execution.py'
      - 'testnet_protected_coordinator.py'
      - 'testnet_one_shot_trial.py'
      - 'test_testnet_one_shot_trial.py'
      - 'test_testnet_protected_coordinator.py'
      - 'gate_testnet_broker.py'
      - 'test_gate_testnet_broker.py'
      - 'testnet_execution_journal.py'
      - 'test_testnet_execution_journal.py'
      - 'testnet_automation.py'
      - 'test_testnet_automation.py'
      - 'testnet_contract_leverage.py'
      - 'test_testnet_contract_leverage.py'
      - 'incoming_testnet_status.py'
      - 'test_incoming_testnet_status.py'
      - 'testnet_execution_attempts.py'
      - 'test_testnet_execution_attempts.py'
      - 'testnet_recovery.py'
      - 'test_testnet_recovery.py'
      - 'testnet_protection_watchdog.py'
      - 'test_testnet_protection_watchdog.py'
      - 'testnet_readiness.py'
      - 'test_testnet_readiness.py'
      - 'testnet_mode_prepare.py'
      - 'test_testnet_mode_prepare.py'
      - 'testnet_leverage_prepare.py'
      - 'test_testnet_leverage_prepare.py'
      - 'app.py'
      - 'testnet_card_feed.py'
      - 'test_testnet_card_feed.py'
      - 'testnet_manual_close.py'
      - 'test_testnet_manual_close.py'
      - 'test_dashboard_card_render.cjs'
      - '.github/workflows/testnet-safety.yml'
  pull_request:
    paths:
      - 'gate_testnet_execution.py'
      - 'test_gate_testnet_execution.py'
      - 'testnet_protected_coordinator.py'
      - 'testnet_one_shot_trial.py'
      - 'test_testnet_one_shot_trial.py'
      - 'test_testnet_protected_coordinator.py'
      - 'gate_testnet_broker.py'
      - 'test_gate_testnet_broker.py'
      - 'testnet_execution_journal.py'
      - 'test_testnet_execution_journal.py'
      - 'testnet_automation.py'
      - 'test_testnet_automation.py'
      - 'testnet_contract_leverage.py'
      - 'test_testnet_contract_leverage.py'
      - 'incoming_testnet_status.py'
      - 'test_incoming_testnet_status.py'
      - 'testnet_execution_attempts.py'
      - 'test_testnet_execution_attempts.py'
      - 'testnet_recovery.py'
      - 'test_testnet_recovery.py'
      - 'testnet_protection_watchdog.py'
      - 'test_testnet_protection_watchdog.py'
      - 'testnet_readiness.py'
      - 'test_testnet_readiness.py'
      - 'testnet_mode_prepare.py'
      - 'test_testnet_mode_prepare.py'
      - 'testnet_leverage_prepare.py'
      - 'test_testnet_leverage_prepare.py'
      - 'app.py'
      - 'testnet_card_feed.py'
      - 'test_testnet_card_feed.py'
      - 'testnet_manual_close.py'
      - 'test_testnet_manual_close.py'
      - 'test_dashboard_card_render.cjs'
      - '.github/workflows/testnet-safety.yml'
permissions:
  contents: read
jobs:
  safety-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install database test dependency
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Compile files
        run: python -m py_compile incoming_testnet_status.py test_incoming_testnet_status.py testnet_contract_leverage.py test_testnet_contract_leverage.py testnet_execution_attempts.py test_testnet_execution_attempts.py testnet_card_feed.py test_testnet_card_feed.py testnet_manual_close.py test_testnet_manual_close.py testnet_unknown_exposure.py test_testnet_unknown_exposure.py gate_testnet_execution.py test_gate_testnet_execution.py testnet_protected_coordinator.py test_testnet_protected_coordinator.py testnet_one_shot_trial.py test_testnet_one_shot_trial.py gate_testnet_broker.py test_gate_testnet_broker.py testnet_execution_journal.py test_testnet_execution_journal.py testnet_automation.py test_testnet_automation.py testnet_recovery.py test_testnet_recovery.py testnet_protection_watchdog.py test_testnet_protection_watchdog.py testnet_readiness.py test_testnet_readiness.py testnet_mode_prepare.py test_testnet_mode_prepare.py testnet_leverage_prepare.py test_testnet_leverage_prepare.py app.py
      - name: Smoke-test LuxAlgo individual coin cards
        run: node test_dashboard_card_render.cjs
      - name: Run isolated unit tests
        run: python -m unittest -v test_incoming_testnet_status.py test_testnet_contract_leverage.py test_testnet_execution_attempts.py test_testnet_unknown_exposure.py test_testnet_manual_close.py test_testnet_card_feed.py test_gate_testnet_execution.py test_testnet_protected_coordinator.py test_testnet_one_shot_trial.py test_gate_testnet_broker.py test_testnet_execution_journal.py test_testnet_automation.py test_testnet_recovery.py test_testnet_protection_watchdog.py test_testnet_readiness.py test_testnet_mode_prepare.py test_testnet_leverage_prepare.py
